version: '3.8'

services:
  mongodb:
    image: mongo:5.0.8
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    container_name: api_service
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    restart: always

volumes:
  mongodb_data: